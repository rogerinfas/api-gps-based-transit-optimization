name: Backend CD

on:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest

    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.VPS_HOST }}"
          test -n "${{ secrets.VPS_USER }}"
          test -n "${{ secrets.VPS_PORT }}"
          test -n "${{ secrets.VPS_KEY }}"
          test -n "${{ secrets.BACKEND_APP_PATH }}"
          test -n "${{ secrets.POSTGRES_PORT }}"
          test -n "${{ secrets.POSTGRES_DB }}"
          test -n "${{ secrets.POSTGRES_USER }}"
          test -n "${{ secrets.POSTGRES_PASSWORD }}"
          test -n "${{ secrets.REGISTRY_USERNAME }}"
          test -n "${{ secrets.REGISTRY_TOKEN }}"

  build_and_push:
    runs-on: ubuntu-latest
    needs: preflight

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            rderoger/api-gps-based-transit-optimization:${{ github.sha }}
            rderoger/api-gps-based-transit-optimization:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push

    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PATH: ${{ secrets.BACKEND_APP_PATH }}
          REPO_URL: https://github.com/rogerinfas/api-gps-based-transit-optimization.git
          BRANCH_NAME: ${{ github.ref_name }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REPO: rderoger/api-gps-based-transit-optimization
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          PORT: "4000"
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: APP_PATH,REPO_URL,BRANCH_NAME,IMAGE_TAG,IMAGE_REPO,REGISTRY_USERNAME,REGISTRY_TOKEN,PORT,POSTGRES_PORT,POSTGRES_DB,POSTGRES_USER,POSTGRES_PASSWORD
          command_timeout: 30m
          script: |
            set -e

            if [ ! -d "$APP_PATH/.git" ]; then
              git clone "$REPO_URL" "$APP_PATH"
            fi

            cd "$APP_PATH"
            git fetch --all --prune
            git checkout "$BRANCH_NAME"
            git reset --hard "origin/$BRANCH_NAME"

            cat > .env <<EOF
            PORT='${PORT}'
            DB_HOST='postgres'
            DB_PORT='5432'
            DB_NAME='${POSTGRES_DB}'
            DB_USER='${POSTGRES_USER}'
            DB_PASSWORD='${POSTGRES_PASSWORD}'
            POSTGRES_PORT='${POSTGRES_PORT}'
            POSTGRES_DB='${POSTGRES_DB}'
            POSTGRES_USER='${POSTGRES_USER}'
            POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'
            DATABASE_URL='postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public'
            IMAGE_TAG='${IMAGE_TAG}'
            API_IMAGE='${IMAGE_REPO}:${IMAGE_TAG}'
            R2_BUCKET_NAME='api-gps'
            R2_ACCOUNT_ID='95f38f4233f5972e6b3d43ede8413d76'
            R2_ACCESS_KEY_ID='553d0ce3668377083378dc228086039c'
            R2_SECRET_ACCESS_KEY='a444564785cbb1e570b5f7eb3c44280119501c3920df0da2fa47795cca06fa9b'
            R2_PUBLIC_URL='https://pub-4331106b91db442db04623a4fff476df.r2.dev'
            CORS_ORIGINS='http://localhost:3000,http://127.0.0.1:3000,https://gps-based-transit-optimization.onlinestornsoftware.win'
            EOF

            # Limpiar contenedores antiguos del proyecto por defecto para liberar puertos
            docker stop transit-api transit-postgres || true
            docker rm transit-api transit-postgres || true

            # Limpiar imágenes y cachés de Docker huérfanas para liberar espacio en el disco del VPS
            docker system prune -f

            echo "${REGISTRY_TOKEN}" | docker login -u "${REGISTRY_USERNAME}" --password-stdin
            docker compose -p transit-backend -f docker/docker-compose.prod.yml pull api
            docker compose -p transit-backend -f docker/docker-compose.prod.yml up -d postgres
            docker compose -p transit-backend -f docker/docker-compose.prod.yml run --rm api pnpm prisma:migrate:deploy
            docker compose -p transit-backend -f docker/docker-compose.prod.yml run --rm api node dist/prisma/seed.js
            docker compose -p transit-backend -f docker/docker-compose.prod.yml up -d api
