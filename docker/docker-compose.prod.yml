services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${API_IMAGE:-rderoger/api-gps-based-transit-optimization:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PORT:-4000}:4000"
    networks:
      - default
      - proxy_net
    labels:
      - "traefik.enable=true"
      # Regla para capturar el tráfico del WebSocket en el dominio actual
      - "traefik.http.routers.backend-io.rule=Host(`gps-based-transit-optimization.onlinestornsoftware.win`) && PathPrefix(`/socket.io`)"
      - "traefik.http.routers.backend-io.entrypoints=websecure"
      - "traefik.http.routers.backend-io.tls=true"
      - "traefik.http.routers.backend-io.tls.certresolver=cloudflare"
      
      # Puerto interno del contenedor
      - "traefik.http.services.backend-io.loadbalancer.server.port=4000"
      
      # Habilitar cookies pegajosas obligatorias para el polling de Socket.io
      - "traefik.http.services.backend-io.loadbalancer.sticky.cookie=true"
      - "traefik.http.services.backend-io.loadbalancer.sticky.cookie.name=io_sticky"
    command: sh -c "pnpm prisma migrate deploy && node dist/src/main"

networks:
  default:
  proxy_net:
    external: true

volumes:
  postgres_data:
